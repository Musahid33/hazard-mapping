# Deploy static site to GitHub Pages automatically on every push to main
# This is the static frontend — it syncs directly to Supabase when
# live-config.json contains the project URL and anon public key. The bundled
# server remains available as a same-origin fallback for Docker/Render.

name: Deploy to GitHub Pages + Live Sync

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Preserve Live Config
        run: |
          echo "Using the checked-in live-config.json (including Supabase public anon key)"
          test -s live-config.json
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('live-config.json','utf8')); if (!c.supabase || !c.supabase.url || !c.supabase.anonKey) { throw new Error('live-config.json must contain supabase.url and supabase.anonKey'); } console.log('Live config is valid; Supabase key is not printed.');"

      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
