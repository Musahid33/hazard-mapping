# Deploy static site to GitHub Pages automatically on every push to main
# This is the static frontend — it will sync to your Supabase-backed server
# if you set the Shared Data Server URL in Settings, or auto-detects if hosted
# together with server.js.

name: Deploy to GitHub Pages + Live Sync

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Inject Live Config
        run: |
          echo "Injecting live URLs into index.html and config"
          # Create a live-config.json that the frontend can fetch
          cat > live-config.json << 'EOF'
          {
            "liveUrl": "https://hazard-mapping.onrender.com",
            "githubRepo": "https://github.com/Musahid33/hazard-mapping",
            "githubPages": "https://musahid33.github.io/hazard-mapping/",
            "supabaseEnabled": true,
            "apiEndpoints": {
              "data": "/api/data",
              "health": "/api/health",
              "config": "/api/config"
            },
            "deployment": {
              "render": "https://hazard-mapping.onrender.com",
              "githubPages": "https://musahid33.github.io/hazard-mapping/",
              "supabase": "https://supabase.com/dashboard"
            },
            "version": "2.0-supabase",
            "updatedAt": "${{ github.event.head_commit.timestamp }}"
          }
          EOF
          cat live-config.json
          # Also ensure index.html references the live server if needed
          # (Frontend auto-detects origin, but we add a meta tag for visibility)
          if ! grep -q "live-config.json" index.html; then
            echo "live-config.json created for frontend discovery"
          fi

      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
